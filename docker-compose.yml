services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: know_your_route
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO stopped publishing Docker Hub images in Sept 2026; Silo is a maintained, drop-in S3-compatible fork
  # (same S3 API and MINIO_* variables). Any S3-compatible server works because the app only speaks S3.
  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 mcli ready local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/silo:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ['/bin/sh', '-c', 'mcli mb --ignore-existing local/know-your-route-assets && echo "Bucket ready"']

volumes:
  pgdata:
  redisdata:
  miniodata:
